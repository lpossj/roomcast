name: Browser compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: firefox
            os: ubuntu-latest
          - browser: webkit
            os: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Provide a virtual audio output on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=roomcast_test
          pactl set-default-sink roomcast_test
      - run: npm run build
      - run: node scripts/check-browser-compatibility.mjs --engine ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-${{ matrix.browser }}
          path: .test/browser-compatibility/
