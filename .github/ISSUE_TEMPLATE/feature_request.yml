name: Feature request / 功能建议
description: 描述使用场景和期望结果
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题或场景 / Problem or use case
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期望结果 / Desired outcome
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案 / Alternatives
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围 / Scope
      options:
        - 房间与邀请
        - 屏幕共享与采集
        - 音频与聊天
        - 网络与 TURN
        - 文档与发布
        - 其他
    validations:
      required: true