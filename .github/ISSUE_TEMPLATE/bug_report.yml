name: Bug report / 问题反馈
description: 反馈一个可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请先移除日志、截图和邀请链接中的密钥、TURN access key、聊天内容和个人信息。
        安全漏洞请不要公开提交，按 SECURITY.md 私下报告。
  - type: input
    id: version
    attributes:
      label: Roomcast 版本 / Version
      placeholder: 0.14.1 Beta
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果 / Actual behavior
    validations:
      required: true
  - type: textarea
    id: network
    attributes:
      label: 网络与 TURN / Network and TURN